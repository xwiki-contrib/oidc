oidc.provider.admin.clients.description=Udbyderen har to forskellige tilstande: den "dynamiske" og den "statiske". Det anbefales generelt at bruge den "statiske" tilstand i produktionsmiljøer, da den giver mere kontrol over, hvem der kan have tillid som afhængig part.
