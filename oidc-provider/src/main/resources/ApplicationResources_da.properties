oidc.provider.clients.description=Dette dokument indeholder metadata om de programmer, der kan bruge OpenID Connect-udbyderen til godkendelse. Du kan ændre dem med objekteditoren. Klienterne har også en liste over tilladte URI'er til omdirigering, som er de URI'er, udbyderen omdirigerer til efter godkendelsen. Det er også muligt at angive en klient med tomme metadata for at give et hvilket som helst program lov til at fungere som afhængig part (relying party) i OpenID Connect.
